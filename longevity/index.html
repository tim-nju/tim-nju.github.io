<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="随机出生于遥远的过去，一直活到现代。选择怎样生活，经历离别、迁居与历史际遇，留下自己的万年编年史。"
    />
    <meta name="theme-color" content="#f5f1e8" />
    <title>长生 · 一个人的万年</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%238c3b2e'/%3E%3Ctext x='32' y='46' text-anchor='middle' font-size='44' fill='%23fffdf8'%3E生%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="wordmark">长生<span>一个人的万年</span></div>
        <label class="cluster" for="theme"
          >外观<select id="theme">
            <option value="system">跟随系统</option>
            <option value="light">浅色</option>
            <option value="dark">深色</option>
          </select></label
        >
      </header>
      <div id="notice" class="notice" role="status" aria-live="polite"></div>
      <main id="app">
        <h1>长生</h1>
        <p>故事正在展开。若长时间停留在这里，请刷新页面。</p>
        <noscript>此游戏需要 JavaScript 才能运行。</noscript>
      </main>
      <footer>
        原创虚构人生模拟 · 参考《80亿分之1》的生活模拟机制 · 历史人物资料附来源<br />存档只在此浏览器。首次打开需要联网；清除浏览器数据会失去存档。
      </footer>
    </div>
  </body>
</html>
